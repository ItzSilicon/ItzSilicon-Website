<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Links</title>
	<style>
		body{font-family: Arial, Helvetica, sans-serif; margin:20px; color:#222}
		header{margin-bottom:16px}
		nav a{margin-right:12px; color:#0366d6; text-decoration:none}
		section{margin-top:12px}
		.link-list{list-style:none; padding:0}
		.link-list li{margin:8px 0}
	</style>
</head>
<body>
	<header>
		<h1>Useful Links</h1>
		<p>A simple base HTML template for storing links.</p>
		<nav>
			<a href="#links">Links</a>
			<a href="#about">About</a>
		</nav>
	</header>

	<main>
		<section id="links">
			<h2>Links</h2>
			<ul class="link-list">
				<li><a href="https://canva.link/vpihznd564grjl8" target="_blank" rel="noopener">Financial Data Science Final Slides</a></li>
			</ul>
		</section>

		<section id="about">
			<h2>About</h2>
			<p>Place your curated links here for quick access.</p>
		</section>
	</main>

	<footer>
		<p>&copy; 2026</p>
	</footer>
</body>
</html>
